<meta name="description" content="Sory Sanogo, directeur artistique à Paris. Identités de marque, édition, campagnes.">
<style>

/* Layout : grille de 12 colonnes, marges de 20 px. Accueil en deux colonnes de projets ; page projet en colonne d'infos fixe à gauche (4/12) et images à droite (8/12). Une seule couleur vive, l'orange d'Abidjan, réservée aux états actifs. */
:root{
  --paper:#FFFFFF;
  --ink:#121211;
  --mute:#7A7873;
  --rule:#E4E2DD;
  --wash:#F3F2EE;
  --signal:#F26B0F;
  --serif:'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --sans:'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --gut:20px;
  --head:56px;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
img{display:block;width:100%;height:auto}
.wrap{padding-left:max(var(--gut), env(safe-area-inset-left,0px));padding-right:max(var(--gut), env(safe-area-inset-right,0px))}
.small{font-size:13px;letter-spacing:.01em}
.cap{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.mute{color:var(--mute)}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);height:var(--head);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);align-items:center;border-bottom:1px solid transparent;transition:border-color .3s}
header.top.scrolled{border-bottom-color:var(--rule)}
.brand{grid-column:1/4;font-weight:600;font-size:15px;letter-spacing:-.005em;white-space:nowrap}
.brand .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--signal);margin-left:6px;vertical-align:1px}
.role{grid-column:4/8;color:var(--mute);font-size:13px}
nav.main{grid-column:8/13;display:flex;justify-content:flex-end;gap:22px;font-size:13px}
nav.main a{position:relative;padding-block:4px}
nav.main a[aria-current="true"],nav.main a:hover{color:var(--signal)}

/* Accueil */
.hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);padding-block:clamp(56px,10vw,140px) clamp(40px,6vw,80px)}
.hero h1{grid-column:1/11;font-family:var(--serif);font-weight:400;font-size:clamp(40px,6.4vw,104px);line-height:.98;letter-spacing:-.018em;margin:0;text-wrap:balance}
.hero h1 em{font-style:italic}
.hero h1 .strike{position:relative;white-space:nowrap;color:var(--mute)}
.hero h1 .strike::after{content:"";position:absolute;left:-.04em;right:-.04em;top:56%;height:.07em;background:var(--signal);transform-origin:left;animation:strike 0.8s 1.15s cubic-bezier(.7,0,.2,1) both}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mot{font-family:var(--serif);font-weight:400;line-height:1.1;letter-spacing:-.005em;color:var(--ink)}
.mot em,.about .lead em{font-style:italic}
.mot s,.about .lead s{text-decoration:none;position:relative;white-space:nowrap;color:var(--mute)}
.mot s::after,.about .lead s::after{content:"";position:absolute;left:-.04em;right:-.04em;top:56%;height:max(1px,.07em);background:var(--signal);transform-origin:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.card .info .t .mot{display:block;font-size:19px;margin-top:6px}
.side .mot{display:block;font-size:clamp(24px,2.2vw,32px);margin-top:14px}
.next .mot{display:block;font-size:clamp(20px,1.8vw,26px);margin-top:10px}
.index .row .mot{font-size:17px}
.side .mot s::after{animation:strike .6s .35s cubic-bezier(.7,0,.2,1) both}
.about .lead s::after{animation:strike .6s .4s cubic-bezier(.7,0,.2,1) both}
@supports (animation-timeline: view()){.card .mot s::after,.next .mot s::after{animation:strike linear both;animation-timeline:view();animation-range:entry 60% cover 35%}}
.about .offer{display:flex;flex-direction:column;gap:10px;font-size:15px;margin:0;padding:0;list-style:none}
.about ol.princ{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:15px;counter-reset:pr}
.about ol.princ li{counter-increment:pr;display:grid;grid-template-columns:3ch 1fr}
.about ol.princ li::before{content:"0" counter(pr);color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.contact .invite b{color:var(--ink);font-weight:500}
.about .pitch{grid-column:1/8;font-size:clamp(17px,1.4vw,20px);line-height:1.45;margin:-40px 0 0;max-width:48ch}
.about .refs{grid-column:1/13}
.about .names{flex-direction:row;flex-wrap:wrap;gap:6px 40px;font-family:var(--serif);font-size:clamp(26px,2.6vw,40px);line-height:1.15}
.about .names small{font-family:var(--sans);font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:.02em}
.about .why{grid-column:1/13}
.about ol.args{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gut);font-size:15px;line-height:1.55}
.about ol.args b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(22px,1.9vw,28px);line-height:1.15;margin-bottom:10px}
.about ul.svc b{font-weight:600}
.about ol.princ li b{font-weight:600}
.about ol.princ li span{color:var(--ink)}
.about ol.princ li span b{display:block}
@media (max-width:900px){.about .pitch{grid-column:1/13;margin-top:-24px}.about ol.args{grid-template-columns:minmax(0,1fr)}}
.contact .invite{display:block;font-family:var(--sans);font-size:15px;color:var(--mute);margin-bottom:10px}
.hero .sub{grid-column:1/13;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);margin-top:clamp(32px,4vw,56px);font-size:13px}
.hero .sub p{margin:0}
.hero .sub .s1{grid-column:1/4}
.hero .sub .s2{grid-column:4/8;color:var(--mute);max-width:46ch}
.hero .sub .s3{grid-column:8/13;text-align:right;color:var(--mute)}
.avail::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2DB66B;margin-right:8px;vertical-align:1px}

.bar{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding-block:10px 18px;gap:16px}
.toggle{display:flex;gap:4px;font-size:13px}
.toggle button{padding:2px 10px;border-radius:99px;border:1px solid transparent;color:var(--mute)}
.toggle button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px var(--gut);padding-bottom:96px}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.card .thumb{aspect-ratio:3/2;overflow:hidden;background:var(--wash);max-width:100%}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .4s}
.card:hover .thumb img{transform:scale(1.025)}
.card .info{display:grid;grid-template-columns:3ch minmax(0,1fr) auto;gap:12px;align-items:baseline;font-size:13px}
.card .info .n{color:var(--mute);font-variant-numeric:tabular-nums}
.card .info .t{font-family:var(--serif);font-size:24px;line-height:1.1;letter-spacing:-.005em}
.card .info .t small{display:block;font-family:var(--sans);font-size:13px;color:var(--mute);margin-top:4px;letter-spacing:0}
.card .info .y{color:var(--mute);font-variant-numeric:tabular-nums}
.card .ar{display:inline-block;opacity:0;transform:translateX(-6px);transition:opacity .35s,transform .35s;color:var(--signal);font-family:var(--sans);font-size:.7em;vertical-align:.15em}
.card:hover .ar{opacity:1;transform:none}
.card:hover .t{color:var(--ink)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;border:1px solid var(--rule);padding:1px 7px;border-radius:99px;color:var(--mute);margin-left:8px;vertical-align:3px;font-family:var(--sans)}

.index{padding-bottom:96px}
.index .row{display:grid;grid-template-columns:5ch minmax(0,3fr) minmax(0,2fr) minmax(0,3fr) 6ch;gap:var(--gut);align-items:baseline;padding-block:14px;border-bottom:1px solid var(--rule);font-size:14px}
.index .row.head{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-block:8px}
.index a.row:hover{color:var(--signal)}
.index .row .t{font-family:var(--serif);font-size:26px;line-height:1.1}
.index .row .y,.index .row .n{font-variant-numeric:tabular-nums}
.index .row .y{text-align:right}
.peek{position:fixed;z-index:20;width:280px;aspect-ratio:3/2;pointer-events:none;opacity:0;transition:opacity .2s;background:var(--wash)}
.peek img{width:100%;height:100%;object-fit:cover}
.peek.on{opacity:1}

/* Page projet */
.project{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);padding-top:32px;padding-bottom:40px}
.side{grid-column:1/5;position:sticky;top:calc(var(--head) + 32px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:28px;padding-right:12px;min-width:0}
.back{font-size:13px;color:var(--mute)}
.back:hover{color:var(--signal)}
.side .count{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.side h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.2vw,64px);line-height:.98;letter-spacing:-.015em;margin:6px 0 0;text-wrap:balance}
.side .kicker{font-size:15px;color:var(--mute);margin-top:10px;max-width:36ch}
.label{display:inline-flex;align-self:flex-start;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;padding:4px 10px;border-radius:99px;border:1px solid var(--ink)}
.label.concept{border-color:var(--signal);color:var(--signal)}
dl.meta{display:grid;grid-template-columns:minmax(0,9ch) minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px;border-top:1px solid var(--rule);padding-top:16px}
dl.meta dt{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
dl.meta dd{margin:0}
.story{display:flex;flex-direction:column;gap:14px;font-size:15px;max-width:44ch}
.story p{margin:0}
.story b{font-weight:600}
.media{grid-column:5/13;display:flex;flex-direction:column;gap:var(--gut);min-width:0}
.media .r{display:grid;gap:var(--gut)}
.media .r.two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.media figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.media figure img{background:var(--wash)}
.media figure video{display:block;width:100%;height:auto;background:var(--wash)}
.media figure.p{width:min(100%,640px);margin-inline:auto}
.media figcaption{font-size:12px;color:var(--mute);display:flex;gap:10px}
.media figcaption span{font-variant-numeric:tabular-nums}
.next{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);border-top:1px solid var(--ink);padding-block:18px 96px;margin-top:56px}
.next .lbl{grid-column:1/5;font-size:13px;color:var(--mute)}
.next a{grid-column:5/13;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gut);align-items:end}
.next .nt{font-family:var(--serif);font-size:clamp(36px,4.6vw,72px);line-height:1;letter-spacing:-.015em}
.next a:hover .nt{color:var(--signal)}
.next .thumb{aspect-ratio:3/2;overflow:hidden;background:var(--wash)}
.next .thumb img{width:100%;height:100%;object-fit:cover}

/* À propos */
.about{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);padding-block:clamp(48px,8vw,110px) 96px;row-gap:64px}
.about .lead{grid-column:1/11;font-family:var(--serif);font-size:clamp(30px,3.6vw,54px);line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
.about .lead em{font-style:italic}
.about .col{min-width:0}
.about .c1{grid-column:1/5}.about .c2{grid-column:5/9}.about .c3{grid-column:9/13}
.about h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;color:var(--mute);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.about ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:14px}
.about li b{font-weight:600;display:block}
.about li span{color:var(--mute)}
.about .bio{display:flex;flex-direction:column;gap:12px;font-size:15px;max-width:52ch}
.about .bio p{margin:0}
.contact{grid-column:1/13;border-top:1px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);row-gap:16px}
.contact .lbl{grid-column:1/5;font-size:13px;color:var(--mute)}
.contact .lines{grid-column:5/13;display:flex;flex-direction:column;gap:6px}
.contact .big{font-family:var(--serif);font-size:clamp(28px,3.4vw,52px);line-height:1.05;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;word-break:break-word}
.copy{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;border:1px solid var(--rule);border-radius:99px;padding:3px 10px;color:var(--mute)}
.copy:hover{border-color:var(--ink);color:var(--ink)}
.big a:hover{color:var(--signal)}

footer.foot{display:flex;justify-content:space-between;gap:16px;padding-block:18px 28px;border-top:1px solid var(--rule);font-size:12px;color:var(--mute)}

.view{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Animations */
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.hero h1 .w>span{display:inline-block;animation:rise 1s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i) * 55ms + 80ms)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero .sub{animation:fade .9s .9s ease both}
.card .thumb{position:relative}
.card .thumb img+img{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.card:hover .thumb img+img{opacity:1}
.sweep{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;background:var(--signal);z-index:40;transform:scaleX(0);transform-origin:left;pointer-events:none}
.sweep.go{animation:sweep .7s cubic-bezier(.6,0,.2,1)}
@keyframes sweep{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}50.1%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
.side>*{animation:fade .6s ease both}
.side>*:nth-child(2){animation-delay:.06s}.side>*:nth-child(3){animation-delay:.12s}.side>*:nth-child(4){animation-delay:.18s}.side>*:nth-child(5){animation-delay:.24s}
@supports (animation-timeline: view()){
  .card{animation:lift linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
  .card .thumb img:first-child{animation:settle linear both;animation-timeline:view();animation-range:entry 0% cover 60%}
  .media figure img{animation:unveil linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
  .next .nt{animation:lift linear both;animation-timeline:view();animation-range:entry 0% entry 80%}
}
@keyframes lift{from{opacity:.5;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes settle{from{transform:scale(1.04)}to{transform:scale(1)}}
@keyframes unveil{from{clip-path:inset(4% 0 0 0);transform:translateY(8px);opacity:.6}to{clip-path:inset(0 0 0 0);transform:none;opacity:1}}


/* Mode organisation (visible seulement par le propriétaire) */
.org{font-size:13px;padding:2px 10px;border-radius:99px;border:1px dashed var(--mute);color:var(--mute);margin-right:8px}
.org:hover{border-color:var(--ink);color:var(--ink)}

{id:'nouchi',w:['', 'Mauvais français', 'Langue vivante'],t:'Nouchi, mot à mot',k:"Un dictionnaire typographique de l’argot d’Abidjan, où chaque mot déborde du format.",type:'Concept',kind:'Édition, typographie',y:'2026',cover:1,alt:5,concept:true,
 meta:[['Contexte','Projet personnel, sans commanditaire'],['Rôle','Concept, direction artistique, mise en page'],['Supports','Livre, affiches, réseaux sociaux, application']],
 story:["<b>Le constat.</b> Le nouchi est une langue vivante et inventive, qu’on présente encore comme du mauvais français. J’ai étudié à Abidjan la langue des philosophes. Celle de la rue mérite la même rigueur de définition.", "<b>L’idée.</b> Donner à la rue son dictionnaire. Je reprends les codes du genre (entrée, phonétique, définition, exemple) et je les pousse à l’échelle de l’affiche. Le mot déborde toujours du format, comme la langue déborde de la norme.", "<b>La réponse.</b> Un grotesque très gras pour les entrées, une serif italique pour les exemples, et une palette tirée d’Abidjan : orange, vert lagune, rose bissap. Le système passe du livre à l’affiche, aux réseaux et à une application."],

{id:'terre-rouge',w:['', 'La marque', 'Le terroir'],t:'Terre Rouge',k:"Un chocolat ivoirien qui dit d’où vient son cacao.",type:'Concept',kind:'Packaging, identité',y:'2026',cover:1,concept:true,alt:3,
 meta:[['Contexte','Projet personnel, sans commanditaire. Marque fictive.'],['Rôle','Concept, direction artistique, identité, packaging'],['Supports','Étuis, coffret, sachet, carte de traçabilité, e-shop']],
 story:["<b>Le constat.</b> La Côte d’Ivoire produit près de 40 % du cacao mondial, mais la valeur et le récit du chocolat restent en Europe. Ce projet personnel part de cet écart entre les deux rives.", "<b>L’idée.</b> Rendre au chocolat son origine. Chaque tablette porte un glyphe inspiré des poids à peser l’or akan, associé à une région de production. On lit le terroir avant de lire la marque.", "<b>La réponse.</b> Un glyphe géant coupé par le pli de l’étui, une couleur pleine par terroir, un coffret, un sachet, et une carte de traçabilité glissée dans chaque tablette pour que le récit voyage avec le produit."],

{id:'ulysse-klean',w:['La rigueur', 'grise', 'chaleureuse'],t:'ULYSSE KLEAN',k:"La marque de mon entreprise de nettoyage : ici, je suis aussi le client.",type:'Entreprise',kind:'Identité, charte, ton de voix',y:'2026',cover:1,alt:2,
 meta:[['Contexte','ULYSSE KLEAN, nettoyage professionnel, Versailles et Île-de-France. Entreprise que j’ai fondée.'],['Rôle','Direction artistique de la marque, charte graphique, plateforme et ton de voix'],['Supports','Charte de 51 pages, campagne, site web, mascotte, réseaux sociaux, tenues']],
 story:["<b>Le constat.</b> Le secteur de la propreté est souvent gris et anonyme, alors que la confiance s’y joue sur chaque détail. Fondateur de l’entreprise, je signe aussi sa marque : chaque choix graphique engage mes équipes et mes clients.", "<b>L’idée.</b> Un ruban tracé d’un seul geste, sans jamais lever la main, comme le passage d’un agent qui ne laisse rien derrière lui. Le ton suit la même règle, résumée en deux mots : la rigueur chaleureuse.", "<b>La réponse.</b> Bleu nuit, cyan, rose poudré et un dégradé solaire réservé aux moments forts. Une charte de 51 pages, puis la campagne « L’effet Klean » pensée pour le métro et l’abribus, le site web, les carrousels LinkedIn et Klinky, la mascotte de la marque."],

{id:'doute',w:['', 'Je sais', 'Je doute'],t:'Doute',k:"Un festival de philosophie nocturne dont toute l’identité tient dans une rature.",type:'Concept',kind:'Identité, affiche',y:'2026',cover:1,alt:4,concept:true,
 meta:[['Contexte','Projet personnel, sans commanditaire. Festival fictif.'],['Rôle','Concept, direction artistique, identité, déclinaisons'],['Supports','Affiches, programme, billetterie, objets, application']],
 story:["<b>Le constat.</b> La philosophie paraît scolaire. Pourtant les 20-40 ans écoutent des heures de podcasts sur le sens du travail ou du temps. Le besoin de penser existe ; il lui manque un lieu qui ne ressemble pas à une salle de classe.", "<b>L’idée.</b> Penser, c’est raturer. Chaque support affiche une certitude barrée, puis sa correction. Le contenu devient le logo. C’est aussi le geste de ce portfolio, hérité de mes années de philosophie : une idée se corrige avant de s’afficher.", "<b>La réponse.</b> Trois nuits dans des lieux inattendus, une serif ample, une grotesque discrète pour l’information et un seul geste vermillon, repris des affiches au programme, à la billetterie, aux objets et à l’application."],
 imgs:[],rows:[]},
{id:'bitume',w:['La ville', 'dort', 'court'],t:'Bitume',k:"Un club de course à pied nocturne qui transforme ses parcours en signes.",type:'Concept',kind:'Identité, sport, digital',y:'2026',cover:1,concept:true,alt:3,
 meta:[['Contexte','Projet personnel, sans commanditaire. Club fictif.'],['Rôle','Concept, direction artistique, identité, application'],['Supports','Affiches, dossard, textile, application, réseaux sociaux']],
 story:["<b>Le constat.</b> Les clubs de running parlent de performance. La course de nuit en ville se vit d’abord comme une façon de traverser Paris ensemble. Le vocabulaire du chrono ne dit rien de cette expérience.", "<b>L’idée.</b> Une phrase pour tout dire : « La ville ne dort pas, elle court. » Chaque parcours GPS devient une forme graphique, et cette même ligne dessine le logo. Le club signe avec ses propres trajets.", "<b>La réponse.</b> Un jaune sécurité sur fond de bitume, un grotesque condensé pour l’énergie, des chiffres partout, et une ligne continue qui relie l’affiche, le dossard, le textile et l’application."],

{id:'egimas',w:['', 'Une maison', 'Un même cadre'],t:'EGIMAS Immobilier',k:'Refonte d’identité d’une agence immobilière d’Abidjan, entre architecture et terre.',type:'Proposition',kind:'Identité, refonte',y:'2026',cover:1,alt:10,
 meta:[['Client','EGIMAS Immobilier, agence immobilière à Abidjan. Proposition de refonte non retenue par le client.'],['Rôle','Direction artistique, refonte du logo, système d’identité, déclinaisons'],['Supports','Logo, charte, panneaux, papeterie, brochure, site web, réseaux sociaux, vitrine']],
 story:["<b>Le constat.</b> L’ancien logo montrait une maison générique et un sigle compressé : l’image d’un cabinet parmi d’autres, loin des villas et des projets haut de gamme que l’agence accompagne à Abidjan.","<b>L’idée.</b> « Modern design. Heritage roots. » Le bâti et le métier dans un même cadre : une silhouette d’immeubles tenue dans un carré, dessinée avec la rigueur de l’architecte et la chaleur de la terre d’ici.","<b>La réponse.</b> Un symbole reconstruit sur une grille unique, une palette du bleu Plateau à la terre cuite, Fraunces et Archivo, et un motif « Façade » qui court des panneaux de chantier à la vitrine de l’agence."],
 imgs:[],rows:[]},
{id:"titro",w:["", "Exotique", "Quotidien"],t:"Titro",k:"Une marque d’attiéké venue d’Abidjan, qui se lit comme un journal du jour.",type:'Concept',kind:"Packaging, identité",y:"2026",cover:1,alt:5,concept:true,
 meta:[["Contexte", "Projet personnel, sans commanditaire. Marque fictive."], ["Rôle", "Concept, naming, direction artistique, identité, packaging"], ["Supports", "Sachets, boîte, bocal, journal de marque, e-shop, kiosque éphémère"]],
 story:["<b>Le constat.</b> À Abidjan, l’attiéké s’achète matin, midi et soir, comme le pain à Paris. Ici, il reste rangé au rayon exotique et présenté comme un « couscous de manioc » : traduit avant d’être goûté.", "<b>L’idée.</b> Un produit qu’on mange tous les jours mérite un quotidien. Le nom vient des titrologues d’Abidjan, qui lisent les unes au kiosque sans acheter le journal. Chaque sachet porte donc une manchette, un numéro, une rubrique et un titre.", "<b>La réponse.</b> Un logotype très condensé dont le O est une boule, trois encres sur papier journal et une trame d’imprimerie dont le point prend la taille du grain. Le système passe du sachet au journal de marque, à l’abonnement en ligne et à un kiosque parisien où la lecture des unes est gratuite."],
 imgs:[],rows:[]},
{id:"un-sur-huit",w:["Un sirop", "pur", "à l’eau"],t:"Un sur huit",k:"Une marque de sirops parisiens qui ne vend que le premier huitième du verre.",type:'Concept',kind:"Packaging, identité",y:"2026",cover:1,alt:4,concept:true,
 meta:[["Contexte", "Projet personnel, sans commanditaire. Marque fictive."], ["Rôle", "Concept, plateforme de marque, identité, packaging, activation"], ["Supports", "Bouteilles, bouchons doseurs, affiches, e-shop, triporteur d’activation"]],
 story:["<b>Le constat.</b> Au rayon des sirops, chacun peint son fruit et promet du « pur ». Pourtant, un sirop ne se boit jamais pur : on le coupe d’eau, un volume pour sept. À Paris, cette eau coule du robinet, des carafes du café et des fontaines publiques.", "<b>L’idée.</b> Vendre la dose et laisser le reste à l’eau de Paris. Le nom est une fraction, la signature le dit sans détour : « Le reste, c’est Paris. » Chaque support réserve un huitième à la couleur du parfum et sept huitièmes au blanc.", "<b>La réponse.</b> Un logotype empilé comme une fraction, dont le point du i devient la goutte de sirop, Inter Tight pour la voix et IBM Plex Mono pour la notice. Une bouteille blanche qui ne montre le sirop que sur son dernier huitième, un bouchon doseur, des affiches, un e-shop qui calcule la dose et une tournée d’été au pied des fontaines."],
 imgs:[],rows:[]},
{id:"teneur",w:["Le karité", "raconté", "dosé"],t:"Teneur",k:"Un soin au karité qui écrit sa dose sur l’emballage, au lieu de raconter une légende.",type:'Concept',kind:"Packaging, identité, cosmétique",y:"2026",cover:1,alt:7,concept:true,
 meta:[["Contexte", "Projet personnel, sans commanditaire. Marque fictive."], ["Rôle", "Concept, naming, direction artistique, identité, packaging"], ["Supports", "Flacons, tube, pot, étuis, fiche de teneur, échantillons, e-shop, affichage"]],
 story:["<b>Le constat.</b> Le karité arrive presque toujours en rayon avec le même récit : rituel ancestral, secret de beauté, mains au soleil. La dermo-cosmétique parisienne, elle, parle en pourcentages et en preuves. Graphiste chez Filorga, j’ai appris ces codes ; on les accorde rarement aux ingrédients d’Afrique de l’Ouest.", "<b>L’idée.</b> Ne plus raconter le karité, le doser. Chaque soin porte sa teneur dans son nom : Sérum 5, Crème 15, Huile 30, Baume 70. Sur l’emballage, une ligne monte exactement à ce pourcentage, et le chiffre devient le récit.", "<b>La réponse.</b> Un logotype en Gloock coupé par cette même ligne, une mono pour les données et une palette tirée des fractions du karité, de l’ambre de l’insaponifiable au beurre brut. Au dos de chaque étui, un tableau de teneur donne la composition complète ; le dispositif court du flacon à l’e-shop et jusqu’aux affiches du métro."],
 imgs:[],rows:[]},
{id:"ressort",w:["Cheveux", "texturés", "crépus"],t:"Ressort",k:"Une marque de soins pour cheveux crépus qui écrit enfin le mot en toutes lettres.",type:'Concept',kind:"Packaging, identité",y:"2026",cover:1,alt:7,concept:true,
 meta:[["Contexte", "Projet personnel, sans commanditaire. Marque fictive."], ["Rôle", "Concept, plateforme de marque, direction artistique, identité, packaging"], ["Supports", "Gamme de cinq flacons, lexique imprimé, carte routine, e-shop, diagnostic mobile, affichage"]],
 story:["<b>Le constat.</b> Les soins pour cheveux crépus parlent rarement de cheveux crépus. On lit « texturés », « rebelles », « à discipliner », et des promesses anti-frisottis qui traitent la matière comme un défaut. Entre le kraft à feuille verte et le flacon blanc de pharmacie, le rayon évite toujours le mot exact.", "<b>L’idée.</b> Appeler le cheveu par son nom. Ressort écrit « crépus » sur chaque flacon et bannit le vocabulaire du combat. Le nom dit la spire, ce cheveu qui se rétracte au séchage et garde sa longueur en réserve.", "<b>La réponse.</b> Un logotype comprimé en son centre, un ressort dessiné dont le serrage change à chaque geste, et une chasse typographique qui suit le contenant : serrée sur les flacons, étirée sur le pot. Bleu franc, jaune, rose et noir pour cinq verbes, de Laver à Sceller, déclinés en lexique, e-shop et campagne d’affichage."],
 imgs:[],rows:[]},
{id:'tsedeq',w:['', 'Un vocabulaire', 'Une grammaire'],t:'TSEDEQ Consulting',k:"Charte graphique d’un cabinet de gestion pour PME et TPE, bâtie sur son logo.",type:'Client',kind:'Charte, déclinaisons',y:'2026',cover:1,alt:6,

function splitWords(el){if(!el)return;let i=0;const out=[];
  el.childNodes.forEach(n=>{if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t))out.push(document.createTextNode(' '));else out.push(wrap(document.createTextNode(t)))})}else out.push(wrap(n.cloneNode(true)))});
  function wrap(node){const w=document.createElement('span');w.className='w';const inner=document.createElement('span');inner.style.setProperty('--i',i++);inner.appendChild(node);w.appendChild(inner);return w}
  el.replaceChildren(...out)}

function wireOrg(){
  const bOrg=document.getElementById('bOrg'),bar=document.getElementById('orgbar'),grid=document.getElementById('vGrid');
  let draft=null,dragId=null;
  const cards=()=>[...grid.querySelectorAll('.card')];
  const apply=()=>{draft.forEach(id=>grid.appendChild(grid.querySelector(`.card[data-id="${id}"]`)));cards().forEach((c,i)=>c.querySelector('.n').textContent=pad(i+1))};
  bOrg.onclick=()=>{draft=P.map(p=>p.id);if(mode!=='grid')document.getElementById('bGrid').click();grid.classList.add('editing');bar.hidden=false;bOrg.hidden=true;
    cards().forEach(c=>{c.draggable=true;c.addEventListener('click',onClick,true)})};
  function onClick(e){if(!grid.classList.contains('editing'))return;e.preventDefault();const b=e.target.closest('[data-mv]');if(!b)return;const id=e.currentTarget.dataset.id,i=draft.indexOf(id),j=i+(+b.dataset.mv);if(j<0||j>=draft.length)return;draft.splice(i,1);draft.splice(j,0,id);apply()}
  grid.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c||!grid.classList.contains('editing'))return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
  grid.addEventListener('dragend',()=>{cards().forEach(c=>c.classList.remove('dragging','over'));dragId=null});
  grid.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const c=e.target.closest('.card');cards().forEach(x=>x.classList.toggle('over',x===c&&x.dataset.id!==dragId))});
  grid.addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();const c=e.target.closest('.card');if(!c||c.dataset.id===dragId)return;const to=draft.indexOf(c.dataset.id);draft.splice(draft.indexOf(dragId),1);draft.splice(to,0,dragId);apply()});

      await artNS.publish(html);msg.textContent='Ordre enregistré.'}

}
